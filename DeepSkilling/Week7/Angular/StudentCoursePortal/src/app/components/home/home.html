<h1>{{ portalName }}</h1>

<p>
  Browse courses, enroll in subjects, and manage your academic profile.
</p>


<p><strong>Courses Available:</strong> {{ availableCourses }}</p>
<p><strong>Enrolled:</strong> 3</p>
<p><strong>GPA:</strong> 3.8</p>

<hr>

<button [disabled]="!isPortalActive"
        (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Search Courses">

<p>Searching for: {{ searchTerm }}</p>

<!--
[property] = One-way binding (Component → DOM)

[(ngModel)] = Two-way binding (DOM ↔ Component)
-->
