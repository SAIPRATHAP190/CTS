version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_bus
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservice_net

  catalogservice:
    build:
      context: ./CatalogService
      dockerfile: Dockerfile
    container_name: catalog_microservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:80"
    networks:
      - microservice_net

  orderservice:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: order_microservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ_Host=rabbitmq
    ports:
      - "5002:80"
    depends_on:
      - catalogservice
      - rabbitmq
    networks:
      - microservice_net

  apigateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: ocelot_gateway
    ports:
      - "5000:80"
    depends_on:
      - catalogservice
      - orderservice
    networks:
      - microservice_net

networks:
  microservice_net:
    driver: bridge
